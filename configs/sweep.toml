# Full study: 2 model sizes × 7 llama.cpp quantization levels + 3 MLX levels.
# Runtime on a MacBook Air M5: several hours (mostly GSM8K). Resumable if interrupted.
# Disk space: ~25 GB of model weights.
# Licenses: Qwen2.5-1.5B is Apache 2.0; Qwen2.5-3B is the Qwen Research License (non-commercial).

[settings]
runs = 3                 # trials per prompt (median reported)
max_tokens = 256         # tokens generated per trial
idle_seconds = 5         # idle power measured before each variant
quiet_cpu_w = 1.5        # wait until idle CPU power drops below this (Spotlight, background jobs)
cooldown_seconds = 30    # pause between variants (fanless machine)
gsm8k_n = 100            # GSM8K questions (first N of the test split)
gsm8k_max_tokens = 512
perplexity_chunks = 40   # WikiText-2 chunks (40 × 512 tokens)
perplexity_ctx = 512
ctx = 4096

[[model]]
name = "qwen2.5-1.5b"

[[model.variant]]
engine = "llama.cpp"
quant = "F16"
bits = 16
repo = "Qwen/Qwen2.5-1.5B-Instruct-GGUF"
files = ["qwen2.5-1.5b-instruct-fp16.gguf"]

[[model.variant]]
engine = "llama.cpp"
quant = "Q8_0"
bits = 8
repo = "Qwen/Qwen2.5-1.5B-Instruct-GGUF"
files = ["qwen2.5-1.5b-instruct-q8_0.gguf"]

[[model.variant]]
