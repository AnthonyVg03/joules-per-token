[project]
name = "joules-per-token"
version = "0.1.0"
description = "What quantization really costs: speed, memory, quality and energy of local LLMs on Apple Silicon."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # standard library only

[project.optional-dependencies]
mlx = ["mlx-lm"]

[project.scripts]
jpt = "jpt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
